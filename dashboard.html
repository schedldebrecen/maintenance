<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ipari CMMS - Élő Dashboard</title>
    <style>
        :root {
            --bg-dark: #0f172a; --surface: #1e293b; --text-main: #f8fafc;
            --text-muted: #94a3b8; --border: #475569; --pri-info: #0ea5e9; 
            --pri-normal: #10b981; --pri-high: #f59e0b; --pri-crit: #ef4444; --pri-prog: #8b5cf6;
        }

        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg-dark); color: var(--text-main); margin: 0; padding: 0; overflow-x: hidden; }
        
        .top-bar { background: var(--surface); padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--border); position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5); }
        .title-group { display: flex; align-items: center; gap: 20px; }
        .title-group h1 { margin: 0; font-size: 24px; color: var(--text-main); letter-spacing: 1px; text-transform: uppercase; }
        .live-badge { background: #10b981; color: #022c22; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; text-transform: uppercase; animation: blink 2s infinite; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

        .time-group { text-align: right; }
        .clock { font-size: 24px; font-weight: bold; letter-spacing: 2px; }
        .refresh-info { font-size: 12px; color: var(--text-muted); margin-top: 5px; }

        .kpi-bar { display: flex; gap: 15px; padding: 20px 30px; background: var(--bg-dark); overflow-x: auto; }
        .kpi-card { flex: 1; min-width: 150px; background: var(--surface); border-radius: 8px; padding: 15px; text-align: center; border: 1px solid var(--border); border-bottom: 4px solid var(--border); cursor: pointer; transition: transform 0.2s, background 0.2s; }
        .kpi-card:hover { transform: translateY(-3px); background: #334155; }
        .kpi-card.active-filter { border: 2px solid white; background: #334155; }
        .kpi-card h3 { margin: 0 0 10px 0; font-size: 14px; color: var(--text-muted); text-transform: uppercase; }
        .kpi-card .val { font-size: 32px; font-weight: bold; }
        
        .kpi-card.crit { border-bottom-color: var(--pri-crit); } .kpi-card.crit .val { color: var(--pri-crit); }
        .kpi-card.high { border-bottom-color: var(--pri-high); } .kpi-card.high .val { color: var(--pri-high); }
        .kpi-card.prog { border-bottom-color: var(--pri-prog); } .kpi-card.prog .val { color: var(--pri-prog); }
        .kpi-card.total { border-bottom-color: var(--pri-info); } .kpi-card.total .val { color: var(--pri-info); }

        .dashboard-container { padding: 0 30px 30px 30px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 20px; }
        
        .section-title { grid-column: 1/-1; font-size: 20px; color: var(--text-muted); border-bottom: 2px solid var(--border); padding-bottom: 10px; margin-top: 20px; margin-bottom: 5px; display:flex; align-items:center; gap: 10px; }
        
        .card { background: var(--surface); border-radius: 10px; padding: 20px; position: relative; border: 1px solid var(--border); box-shadow: 0 4px 6px rgba(0,0,0,0.3); display: flex; flex-direction: column; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; border-left: 6px solid var(--pri-normal); }
        .card:hover { transform: scale(1.02); box-shadow: 0 10px 15px rgba(0,0,0,0.5); }
        .card.Informatív { border-left-color: var(--pri-info); }
        .card.Magas { border-left-color: var(--pri-high); }
        .card.Termelésleállás { border-left-color: var(--pri-crit); box-shadow: 0 0 15px rgba(239, 68, 68, 0.2); }
        .card.Termelésleállás:hover { box-shadow: 0 0 25px rgba(239, 68, 68, 0.4); }
        .card.Folyamatban { border-left-color: var(--pri-prog); background: #1e1b4b; }

        .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
        .machine-name { font-size: 18px; font-weight: bold; color: #e2e8f0; margin-bottom: 8px; }
        .issue-desc { font-size: 16px; color: #cbd5e1; line-height: 1.4; margin-bottom: 15px; }
        
        .badge { padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: bold; text-transform: uppercase; letter-spacing: 0.5px; }
        .badge-info { background: rgba(14, 165, 233, 0.2); color: #38bdf8; border: 1px solid var(--pri-info); }
        .badge-normal { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid var(--pri-normal); }
        .badge-high { background: rgba(245, 158, 11, 0.2); color: #fbbf24; border: 1px solid var(--pri-high); }
        .badge-crit { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid var(--pri-crit); animation: pulse-border 2s infinite; }
        @keyframes pulse-border { 0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); } 70% { box-shadow: 0 0 0 8px rgba(239, 68, 68, 0); } 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); } }

        .meta-footer { margin-top: auto; display: flex; justify-content: space-between; align-items: flex-end; padding-top: 15px; border-top: 1px solid var(--border); font-size: 13px; color: var(--text-muted); }
        .in-progress-bar { background: rgba(139, 92, 246, 0.2); border: 1px solid var(--pri-prog); color: #a78bfa; padding: 10px; border-radius: 6px; margin-bottom: 15px; font-size: 14px; display: flex; align-items: center; gap: 10px; }

        #progressBar { position: absolute; bottom: -2px; left: 0; height: 2px; background: var(--pri-info); width: 0%; transition: width 1s linear; }

        /* MODAL KINÉZET */
        .modal-overlay { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.85); z-index: 1000; align-items: center; justify-content: center; backdrop-filter: blur(5px); }
        .modal-content { background: var(--surface); padding: 30px; border-radius: 10px; border: 1px solid var(--border); max-width: 600px; width: 90%; max-height: 90vh; overflow-y: auto; color: var(--text-main); box-shadow: 0 10px 40px rgba(0,0,0,0.8); }
        .modal-content h2 { margin-top:0; color: var(--pri-info); border-bottom: 1px solid var(--border); padding-bottom: 15px; font-size: 24px; }
        .btn-close-modal { background: var(--border); color: white; border: none; padding: 12px 20px; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; width: 100%; margin-top: 25px; transition: background 0.2s; }
        .btn-close-modal:hover { background: #64748b; }

        @media (max-width: 768px) {
            .top-bar { flex-direction: column; gap: 10px; align-items: flex-start; padding: 15px; }
            .time-group { text-align: left; } .kpi-bar { padding: 15px; } .dashboard-container { padding: 0 15px 15px 15px; } .grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="title-group">
            <h1>🛠️ CMMS Dashboard</h1>
            <div class="live-badge">ÉLŐ</div>
        </div>
        <div class="time-group">
            <div class="clock" id="clockDisplay">00:00:00</div>
            <div class="refresh-info">Következő frissítés: <span id="countdownDisplay">60</span>mp</div>
        </div>
        <div id="progressBar"></div>
    </div>

    <!-- KPI SÁV - KATTINTHATÓ SZŰRŐK -->
    <div class="kpi-bar">
        <div class="kpi-card crit" id="kpiCard-Crit" onclick="setDashboardFilter('Crit')">
            <h3>Termelésleállás</h3>
            <div class="val" id="kpiCrit">0</div>
        </div>
        <div class="kpi-card high" id="kpiCard-High" onclick="setDashboardFilter('High')">
            <h3>Sürgős (Magas)</h3>
            <div class="val" id="kpiHigh">0</div>
        </div>
        <div class="kpi-card prog" id="kpiCard-Prog" onclick="setDashboardFilter('Prog')">
            <h3>Folyamatban lévő</h3>
            <div class="val" id="kpiProg">0</div>
        </div>
        <div class="kpi-card total" id="kpiCard-Total" onclick="setDashboardFilter(null)">
            <h3>Összes Nyitott</h3>
            <div class="val" id="kpiTotal">0</div>
        </div>
    </div>

    <div class="dashboard-container">
        <div class="grid" id="taskGrid">
            <h2 style="grid-column: 1/-1; text-align: center; color: var(--text-muted); margin-top: 50px;">Adatok betöltése...</h2>
        </div>
    </div>

    <!-- MODAL (Feladat Részletek) -->
    <div class="modal-overlay" id="taskModal" onclick="closeModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div style="display:flex; justify-content:space-between; align-items:flex-start;">
                <h2 id="modalTitle" style="flex:1;">Gép neve</h2>
                <span id="modalPrio" class="badge badge-normal" style="margin-left:15px; font-size:14px;">Normál</span>
            </div>
            <div style="color: #cbd5e1; font-size: 18px; margin-bottom: 20px; line-height:1.4;" id="modalSubtitle">Feladat leírása</div>
            
            <div id="modalDetails" style="font-size:15px; line-height: 1.6; border-top: 1px solid var(--border); padding-top: 15px;">
                <!-- Részletek JS generálja ide -->
            </div>

            <button class="btn-close-modal" onclick="closeModal(true)">Bezárás</button>
        </div>
    </div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbziABd0I2cSep7TveoNoaQZkI5FzxYl4suqSfCR2rD8MXJQNMHPiygbTD8MK0T3Qz40/exec"; 

    const REFRESH_INTERVAL_SEC = 60; 
    let timer = REFRESH_INTERVAL_SEC;
    let currentActiveTasks = [];
    
    // Szűrés változók
    let activeFilter = null; 
    let autoResetTimeout = null;

    setInterval(() => {
        document.getElementById('clockDisplay').innerText = new Date().toLocaleTimeString('hu-HU');
    }, 1000);

    setInterval(() => {
        timer--;
        if (timer <= 0) { timer = REFRESH_INTERVAL_SEC; fetchDashboardData(); }
        document.getElementById('countdownDisplay').innerText = timer;
        document.getElementById('progressBar').style.width = (((REFRESH_INTERVAL_SEC - timer) / REFRESH_INTERVAL_SEC) * 100) + "%";
    }, 1000);

    window.onload = fetchDashboardData;

    async function fetchDashboardData() {
        try {
            const res = await fetch(SCRIPT_URL, { method: "POST", body: JSON.stringify({ action: "getTasks" }) });
            const result = await res.json();
            if(result.status === "success") { processData(result.data); } 
            else { document.getElementById('taskGrid').innerHTML = `<h2 style="grid-column: 1/-1; color: var(--pri-crit); text-align: center;">Hiba: ${result.message}</h2>`; }
        } catch (e) { console.error("Hiba:", e); }
    }

    function processData(allTasks) {
        currentActiveTasks = allTasks.filter(t => t.statusz !== "Lezárt");
        currentActiveTasks.forEach(t => {
            if(t.prioritas === "Igen") t.prioritas = "Magas prioritás";
            if(t.prioritas === "Nem") t.prioritas = "Normál";
        });

        // KPI Frissítés
        let cCrit = 0, cHigh = 0, cProg = 0;
        currentActiveTasks.forEach(t => {
            if(t.prioritas.includes("Leállás")) cCrit++;
            if(t.prioritas.includes("Magas")) cHigh++;
            if(t.statusz === "Folyamatban") cProg++;
        });

        document.getElementById('kpiCrit').innerText = cCrit; 
        document.getElementById('kpiHigh').innerText = cHigh;
        document.getElementById('kpiProg').innerText = cProg; 
        document.getElementById('kpiTotal').innerText = currentActiveTasks.length;

        renderGrid();
    }

    // --- SZŰRŐ LOGIKA ---
    function setDashboardFilter(filterType) {
        // Toggle (Ha már ez volt aktív, akkor kikapcsolja)
        if (activeFilter === filterType) activeFilter = null;
        else activeFilter = filterType;
        
        // UI Frissítés (Kártyák aktív stílusa)
        document.querySelectorAll('.kpi-card').forEach(el => el.classList.remove('active-filter'));
        if (activeFilter) document.getElementById('kpiCard-' + activeFilter).classList.add('active-filter');
        else document.getElementById('kpiCard-Total').classList.add('active-filter');

        // Automatikus visszaugrás (45 másodperc múlva törli a szűrést)
        if (autoResetTimeout) clearTimeout(autoResetTimeout);
        if (activeFilter !== null) {
            autoResetTimeout = setTimeout(() => {
                setDashboardFilter(null); // Visszaáll az összesre
            }, 45000);
        }

        renderGrid();
    }

    function renderGrid() {
        const grid = document.getElementById('taskGrid');
        
        if (currentActiveTasks.length === 0) { 
            grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; margin-top: 100px;"><div style="font-size: 60px; margin-bottom: 20px;">🎉</div><h2 style="color: var(--pri-normal);">Minden gép üzemel!</h2></div>`; 
            return; 
        }

        // Adatok Szűrése
        let filteredTasks = currentActiveTasks;
        if (activeFilter === 'Crit') filteredTasks = currentActiveTasks.filter(t => t.prioritas.includes("Leállás"));
        else if (activeFilter === 'High') filteredTasks = currentActiveTasks.filter(t => t.prioritas.includes("Magas"));
        else if (activeFilter === 'Prog') filteredTasks = currentActiveTasks.filter(t => t.statusz === "Folyamatban");

        if (filteredTasks.length === 0) {
            grid.innerHTML = `<h2 style="grid-column: 1/-1; text-align: center; color: var(--text-muted); margin-top: 50px;">Nincs feladat ebben a kategóriában.</h2>`;
            return;
        }

        // Szétválasztjuk a normál hibákat és a PREV (Ismétlődő) feladatokat
        let normalTasks = filteredTasks.filter(t => !t.id.startsWith("PREV-"));
        let prevTasks = filteredTasks.filter(t => t.id.startsWith("PREV-"));

        // Rendezzük a normál feladatokat fontosság szerint
        const w = { "Termelésleállás": 4, "Magas prioritás": 3, "Normál": 2, "Informatív": 1 };
        const sorter = (a, b) => {
            if (a.statusz === "Folyamatban" && b.statusz !== "Folyamatban") return -1;
            if (a.statusz !== "Folyamatban" && b.statusz === "Folyamatban") return 1;
            let pD = (w[b.prioritas] || 0) - (w[a.prioritas] || 0);
            if (pD !== 0) return pD;
            return new Date(a.idopont) - new Date(b.idopont);
        };
        normalTasks.sort(sorter);
        prevTasks.sort(sorter);

        let html = "";
        
        // 1. NORMÁL FELADATOK RENDERELÉSE
        if (normalTasks.length > 0) {
            if(prevTasks.length > 0) html += `<div class="section-title">🚨 Aktuális Hibák és Feladatok</div>`;
            normalTasks.forEach(task => { html += generateCardHtml(task); });
        }

        // 2. ISMÉTLŐDŐ (TERVEZETT) FELADATOK RENDERELÉSE ALULRA
        if (prevTasks.length > 0) {
            html += `<div class="section-title" style="margin-top:40px; color: var(--pri-info); border-color: var(--pri-info);">🔁 Tervezett Karbantartások</div>`;
            prevTasks.forEach(task => { html += generateCardHtml(task); });
        }

        grid.innerHTML = html;
    }

    function generateCardHtml(task) {
        const dateObj = new Date(task.idopont);
        const timeStr = dateObj.toLocaleTimeString('hu-HU', {hour: '2-digit', minute:'2-digit'});
        const dateStr = dateObj.toLocaleDateString('hu-HU', {month:'short', day:'numeric'});
        const prioShort = task.prioritas.replace(" prioritás", "").replace("ással járó", "");
        
        let bC = "badge-normal", eC = "";
        if(task.prioritas.includes("Leállás")) { bC = "badge-crit"; eC = "Termelésleállás"; }
        else if(task.prioritas.includes("Magas")) { bC = "badge-high"; eC = "Magas"; }
        else if(task.prioritas === "Informatív") { bC = "badge-info"; eC = "Informatív"; }
        if (task.statusz === "Folyamatban") eC = "Folyamatban";

        let inP = task.statusz === "Folyamatban" ? `<div class="in-progress-bar"><span>⚙️</span> <b>${task.felelos}</b> éppen dolgozik rajta</div>` : "";
        let prevIcon = task.id.startsWith("PREV-") ? "🔁 " : "";

        return `
        <div class="card ${eC}" onclick="openModal('${task.id}')">
            <div class="card-header"><span class="badge ${bC}">${prioShort}</span><span style="color: var(--text-muted); font-size: 13px; font-weight:bold;">${dateStr} - ${timeStr}</span></div>
            <div class="machine-name">${prevIcon}${task.gep}</div>
            ${inP}
            <div class="issue-desc">${task.hiba}</div>
            
            <div class="meta-footer"><div>Beküldte: <b>${task.felhasznalo}</b></div><div style="color: var(--text-muted); font-size:11px;">Részletek megnyitása 👆</div></div>
        </div>`;
    }

    // --- MODAL LOGIKA ---
    function openModal(taskId) {
        const task = currentActiveTasks.find(t => t.id === taskId);
        if (!task) return;

        document.getElementById('modalTitle').innerText = (task.id.startsWith("PREV-") ? "🔁 " : "") + task.gep;
        document.getElementById('modalSubtitle').innerText = task.hiba;
        
        let pB = "badge-normal";
        if(task.prioritas.includes("Leállás")) pB = "badge-crit";
        else if(task.prioritas.includes("Magas")) pB = "badge-high";
        else if(task.prioritas === "Informatív") pB = "badge-info";
        
        let prioSpan = document.getElementById('modalPrio');
        prioSpan.className = `badge ${pB}`;
        prioSpan.innerText = task.prioritas;

        let details = `<p style="margin:5px 0;"><b>Státusz:</b> <span style="color:var(--pri-info);">${task.statusz}</span></p>`;
        details += `<p style="margin:5px 0;"><b>Rögzítette:</b> ${task.felhasznalo} <span style="color:var(--text-muted); font-size:13px;">(${new Date(task.idopont).toLocaleString('hu-HU')})</span></p>`;
        
        if (task.statusz === 'Folyamatban') {
            details += `<div style="background: rgba(139, 92, 246, 0.2); padding:10px; border-radius:6px; color:#a78bfa; margin-top:10px; border:1px solid var(--pri-prog);">👷 <b>${task.felelos}</b> dolgozik rajta</div>`;
        }

        if (task.checklist) {
            let items = task.checklist.split('\n').filter(i => i.trim() !== "").map(i => `<li style="margin-bottom:8px;">${i}</li>`).join('');
            details += `<div style="background:#f8fafc; border:1px solid var(--border); padding:15px; border-radius:6px; margin-top:20px;">
                            <strong style="color:var(--primary); display:block; margin-bottom:10px; font-size:18px;">📝 Ellenőrzőlista:</strong>
                            <ul style="padding-left:20px; color:var(--text-main); margin:0;">${items}</ul>
                        </div>`;
        }

        if (task.kepek) {
           let kH = `<div style="display:flex; gap:10px; margin-top:20px; overflow-x:auto;">`;
           task.kepek.split(",").forEach(u => {
               if(u.trim()) {
                   const m = u.match(/id=([^&]+)/); 
                   const thumb = m ? `https://drive.google.com/thumbnail?id=${m[1]}&sz=w400` : u.trim();
                   kH += `<img src="${thumb}" onclick="window.open('${u.trim()}', '_blank')" style="max-height:150px; border-radius:6px; cursor:pointer; border:1px solid var(--border);">`;
               }
           });
           kH += `</div>`;
           details += kH;
        }

        document.getElementById('modalDetails').innerHTML = details;
        
        // Modal animált megjelenítése
        const modal = document.getElementById('taskModal');
        modal.style.display = "flex";
    }

    function closeModal(force = false) {
        if(force === true || event.target.id === 'taskModal') {
            document.getElementById('taskModal').style.display = "none";
        }
    }
</script>
</body>
</html>
