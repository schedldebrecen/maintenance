<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vonalkódos Raktárkezelő</title>
    <meta name="theme-color" content="#0D6EFD">
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #F8F9FA; padding: 15px; margin: 0; text-align: center; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 400px; margin: auto; }
        h2 { color: #0D6EFD; margin-top: 0; }
        input { width: 90%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #ccc; font-size: 16px; box-sizing: border-box; }
        button { width: 90%; padding: 14px; margin: 10px 0; border-radius: 8px; border: none; font-size: 16px; font-weight: bold; color: white; cursor: pointer; }
        .btn-primary { background: #0D6EFD; }
        .btn-cam { background: #6C757D; }
        .btn-remove { background: #DC3545; }
        .btn-add { background: #198754; }
        #reader { width: 100%; max-width: 350px; margin: 10px auto; border-radius: 8px; overflow: hidden; display: none; }
        #item_info { margin: 15px 0; font-size: 15px; min-height: 50px; text-align: left; background: #f1f3f5; padding: 10px; border-radius: 8px;}
        #loader { display: none; color: #FFC107; font-weight: bold; margin-bottom: 10px; }
        
        /* ÚJ: FÜLEK DIZÁJNJA */
        .tabs { display: flex; margin-bottom: 15px; border-radius: 8px; overflow: hidden; border: 1px solid #0D6EFD; }
        .tab { flex: 1; padding: 10px; background: white; color: #0D6EFD; font-weight: bold; cursor: pointer; border: none; font-size: 14px; }
        .tab.active { background: #0D6EFD; color: white; }
        
        /* BÖNGÉSZŐ LISTA DIZÁJN */
        .list-container { max-height: 400px; overflow-y: auto; text-align: left; margin-top: 10px; border: 1px solid #ccc; border-radius: 5px; }
        .search-item { padding: 12px; border-bottom: 1px solid #eee; font-size: 14px; cursor: pointer; }
        .search-item:nth-child(even) { background-color: #f9f9f9; }
        .search-item:active { background: #e2e6ea; }
        .tag { font-weight: bold; color: #0D6EFD; }
    </style>
</head>
<body>

<!-- BEJELENTKEZŐ ABLAK -->
<div class="card" id="login_screen">
    <h2>🔐 Bejelentkezés</h2>
    <input type="text" id="login_user" placeholder="Felhasználónév (pl. Admin)">
    <input type="password" id="login_pin" placeholder="PIN Kód" inputmode="numeric">
    <button class="btn-primary" onclick="doLogin()">Belépés</button>
    <div id="login_loader" style="display:none; color: #FFC107;">Azonosítás folyamatban...</div>
</div>

<!-- FŐ ALKALMAZÁS ABLAK -->
<div class="card" id="app_screen" style="display:none; position: relative; padding-top: 10px;">
    
    <!-- FÜLEK -->
    <div class="tabs">
        <button class="tab active" id="tab_scan" onclick="switchTab('scan')">📷 Olvasó & Könyvelés</button>
        <button class="tab" id="tab_browse" onclick="switchTab('browse')">🔍 Böngésző</button>
    </div>

    <!-- 1. FÜL: KÖNYVELÉS (Eredeti nézet) -->
    <div id="scan_view">
        <button class="btn-cam" onclick="startScanner()" id="camBtn">📷 Vonalkód Olvasása</button>
        <div id="reader"></div>
        
        <input type="text" id="erp_id" placeholder="Cikkszám (Kézzel is beírható)" onchange="keresCikk()" style="font-weight: bold;">
        
        <div id="loader">⏳ Adatok lekérése a felhőből...</div>
        <div id="item_info">Nincs kiválasztott tétel.</div>
        
        <input type="number" id="qty" placeholder="Mennyiség (db)" min="1" value="1">
        <input type="text" id="remark" placeholder="Megjegyzés (Kötelező)">
        
        <button class="btn-remove" onclick="konyvel('remove')">➖ KIVÉT (Kiadás)</button>
        <button class="btn-add" onclick="konyvel('return_item')">➕ VISSZAVÉTELEZÉS</button>
    </div>

    <!-- 2. FÜL: BÖNGÉSZÉS (Új nézet) -->
    <div id="browse_view" style="display: none;">
        <input type="text" id="local_search" placeholder="Gyorskeresés a cikkek között..." oninput="filterList()" autocomplete="off">
        <div id="browse_loader" style="display: none; color: #198754; font-weight: bold; margin: 10px;">Adatok letöltése...</div>
        <div id="item_list" class="list-container"></div>
    </div>
    
</div>

<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz31ckHWQXgMuapMDOD7xyKxRIAJoCjbwvYLWoL7b6UqPz5-WZXbzpGH5i_y9yXpPo/exec"; 
    const html5QrCode = new Html5Qrcode("reader");
    let currentUser = "";
    let allItems = []; // Itt tároljuk a letöltött cikkeket a gyors böngészéshez

    async function doFetch(payload) {
        const res = await fetch(SCRIPT_URL, {
            method: 'POST',
            body: JSON.stringify(payload)
        });
        const text = await res.text();
        try {
            return JSON.parse(text);
        } catch(e) {
            throw new Error("Szerver hiba (A Google Apps Script hibaüzenetet küldött):\n" + text);
        }
    }

    async function doLogin() {
        const u = document.getElementById("login_user").value.trim();
        const p = document.getElementById("login_pin").value.trim();
        if(!u || !p) return alert("Add meg a nevet és a PIN kódot!");
        
        document.getElementById("login_loader").style.display = "block";
        try {
            const data = await doFetch({ action: 'login', user: u, pin: p });
            document.getElementById("login_loader").style.display = "none";
            
            if (data.status === 'ok') {
                currentUser = data.name;
                document.getElementById("login_screen").style.display = "none";
                document.getElementById("app_screen").style.display = "block";
            } else {
                alert(data.message);
            }
        } catch(e) {
            document.getElementById("login_loader").style.display = "none";
            alert("Hálózati/Szerver hiba:\n" + e.message);
        }
    }

    // FÜLEK VÁLTÁSA
    function switchTab(tab) {
        if (tab === 'scan') {
            document.getElementById('scan_view').style.display = 'block';
            document.getElementById('browse_view').style.display = 'none';
            document.getElementById('tab_scan').classList.add('active');
            document.getElementById('tab_browse').classList.remove('active');
        } else {
            document.getElementById('scan_view').style.display = 'none';
            document.getElementById('browse_view').style.display = 'block';
            document.getElementById('tab_scan').classList.remove('active');
            document.getElementById('tab_browse').classList.add('active');
            // Ha még üres a lista, töltsük le az egészet
            if (allItems.length === 0) loadAllItems();
        }
    }

    // BÖNGÉSZŐ LISTA BETÖLTÉSE
    async function loadAllItems() {
        document.getElementById('browse_loader').style.display = "block";
        try {
            const data = await doFetch({ action: 'get_all' });
            if (data.status === 'ok') {
                allItems = data.results;
                renderList(allItems);
            } else {
                alert(data.message);
            }
        } catch(e) {
            alert("Hiba a cikkek letöltésekor: " + e.message);
        }
        document.getElementById('browse_loader').style.display = "none";
    }

    // LISTA MEGJELENÍTÉSE
    function renderList(items) {
        const div = document.getElementById('item_list');
        div.innerHTML = "";
        items.forEach(r => {
            const el = document.createElement('div');
            el.className = 'search-item';
            el.innerHTML = `<span class="tag">${r.erpid}</span><br>${r.name} <br><small>Hely: ${r.location} | Készlet: <b style="color:#198754">${r.qty} db</b></small>`;
            el.onclick = () => {
                // Ha rákattint, átvált a könyvelő ablakra
                document.getElementById("erp_id").value = r.erpid;
                switchTab('scan');
                keresCikk();
            };
            div.appendChild(el);
        });
    }

    // HELYI GYORSKERESÉS A LETÖLTÖTT LISTÁBAN
    function filterList() {
        const q = document.getElementById("local_search").value.toLowerCase();
        const filtered = allItems.filter(r => r.erpid.toLowerCase().includes(q) || r.name.toLowerCase().includes(q));
        renderList(filtered);
    }

    // VONALKÓD OLVASÓ FUNKCIÓK
    function startScanner() {
        document.getElementById("reader").style.display = "block";
        document.getElementById("camBtn").style.display = "none";
        const config = { fps: 10, qrbox: { width: 250, height: 100 } };
        
        html5QrCode.start({ facingMode: "environment" }, config, (decodedText) => {
            document.getElementById("erp_id").value = decodedText;
            if (navigator.vibrate) navigator.vibrate(200);
            stopScanner();
            keresCikk(); 
        }).catch(err => {
            alert("Kamera hiba: Engedélyezd a böngészőnek a kamera használatát!");
            stopScanner();
        });
    }

    function stopScanner() {
        try { html5QrCode.stop(); } catch(e) {}
        document.getElementById("reader").style.display = "none";
        document.getElementById("camBtn").style.display = "inline-block";
    }

    async function keresCikk() {
        const erpid = document.getElementById("erp_id").value.trim();
        if (!erpid) return;
        
        document.getElementById("item_info").innerHTML = "";
        document.getElementById("loader").style.display = "block";
        
        try {
            const data = await doFetch({ action: 'get', erp_id: erpid });
            document.getElementById("loader").style.display = "none";
            
            if (data.status === 'ok') {
                document.getElementById("item_info").innerHTML = `
                    <span class="tag">${data.name}</span><br>
                    <span style="color: gray;">Raktárhely:</span> <b>${data.location}</b><br>
                    <span style="color: gray;">Készlet:</span> <b style="color: #198754; font-size: 18px;">${data.qty} db</b>
                `;
            } else {
                document.getElementById("item_info").innerHTML = `<span style="color: red;">${data.message}</span>`;
            }
        } catch(e) {
            document.getElementById("loader").style.display = "none";
            document.getElementById("item_info").innerHTML = `<span style="color: red;">Hiba: ${e.message}</span>`;
        }
    }

    async function konyvel(action) {
        const erpid = document.getElementById("erp_id").value.trim();
        const qty = parseInt(document.getElementById("qty").value);
        const remark = document.getElementById("remark").value.trim();
        
        if (!erpid || !qty || qty <= 0) return alert("Hibás vagy hiányzó adatok (Cikkszám, Mennyiség)!");
        if (!remark) return alert("Könyveléshez a megjegyzés mező kitöltése kötelező!");
        
        document.getElementById("loader").style.display = "block";
        
        try {
            const data = await doFetch({ action: action, erp_id: erpid, qty: qty, remark: remark, user: currentUser });
            document.getElementById("loader").style.display = "none";
            
            if (data.status === 'ok') {
                alert(`Sikeres könyvelés!\nÚj készlet: ${data.new_qty} db`);
                document.getElementById("erp_id").value = "";
                document.getElementById("qty").value = "1";
                document.getElementById("remark").value = "";
                document.getElementById("item_info").innerText = "Nincs kiválasztott tétel.";
                // Frissítsük a háttérben lévő böngésző listát is, hogy pontos legyen
                if (allItems.length > 0) loadAllItems(); 
            } else {
                alert("Hiba történt: " + data.message);
            }
        } catch(e) {
            document.getElementById("loader").style.display = "none";
            alert("Könyvelési hiba:\n" + e.message);
        }
    }
</script>
</body>
</html>
