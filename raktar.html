<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vonalkódos Raktárkezelő</title>
    <meta name="theme-color" content="#0D6EFD">
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #F8F9FA; padding: 15px; margin: 0; text-align: center; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 400px; margin: auto; }
        h2 { color: #0D6EFD; margin-top: 0; }
        input[type="text"], input[type="number"], input[type="password"] { width: 90%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #ccc; font-size: 16px; box-sizing: border-box; }
        button { width: 90%; padding: 14px; margin: 10px 0; border-radius: 8px; border: none; font-size: 16px; font-weight: bold; color: white; cursor: pointer; }
        .btn-primary { background: #0D6EFD; }
        .btn-cam { background: #6C757D; }
        .btn-search-mode { background: #FD7E14; margin-top: 0 !important; }
        .btn-remove { background: #DC3545; }
        .btn-add { background: #198754; }
        
        #scanner_wrapper { position: relative; max-width: 350px; margin: 10px auto; display: none; }
        #reader { width: 100%; border-radius: 8px; overflow: hidden; }
        
        #item_info { margin: 15px 0; font-size: 15px; min-height: 50px; text-align: left; background: #f1f3f5; padding: 10px; border-radius: 8px;}
        #loader { display: none; color: #FFC107; font-weight: bold; margin-bottom: 10px; }
        
        #zoom_container { display: none; margin: 10px auto; width: 90%; text-align: left; background: #e9ecef; padding: 10px; border-radius: 8px; box-sizing: border-box; }
        #zoom_slider { width: 100%; margin-top: 5px; }
        
        /* VIZUÁLIS VISSZAJELZÉS */
        #scan_feedback { position: absolute; top: 10px; left: 10px; right: 10px; padding: 10px; border-radius: 8px; font-weight: bold; color: white; display: none; z-index: 100; text-align: center; text-shadow: 1px 1px 2px black; font-size: 16px; transition: 0.2s; }

        .tabs { display: flex; margin-bottom: 15px; border-radius: 8px; overflow: hidden; border: 1px solid #0D6EFD; }
        .tab { flex: 1; padding: 10px; background: white; color: #0D6EFD; font-weight: bold; cursor: pointer; border: none; font-size: 14px; }
        .tab.active { background: #0D6EFD; color: white; }
        
        .list-container { max-height: 400px; overflow-y: auto; text-align: left; margin-top: 10px; border: 1px solid #ccc; border-radius: 5px; }
        .search-item { padding: 12px; border-bottom: 1px solid #eee; font-size: 14px; cursor: pointer; }
        .search-item:nth-child(even) { background-color: #f9f9f9; }
        .search-item:active { background: #e2e6ea; }
        .tag { font-weight: bold; color: #0D6EFD; }
        
        .image-box { margin: 10px auto; text-align: left; background: #e9ecef; padding: 15px; border-radius: 8px; width: 90%; box-sizing: border-box; }
        .image-box label { font-weight: bold; cursor: pointer; display: block; font-size: 16px;}
        .image-box input[type="file"] { margin-top: 10px; width: 100%; font-size: 14px; }
    </style>
</head>
<body>

<div class="card" id="login_screen">
    <h2>🔐 Bejelentkezés</h2>
    <input type="text" id="login_user" placeholder="Felhasználónév (pl. Admin)">
    <input type="password" id="login_pin" placeholder="PIN Kód" inputmode="numeric">
    <button class="btn-primary" onclick="doLogin()">Belépés</button>
    <div id="login_loader" style="display:none; color: #FFC107;">Azonosítás folyamatban...</div>
</div>

<div class="card" id="app_screen" style="display:none; position: relative; padding-top: 10px;">
    
    <div class="tabs">
        <button class="tab active" id="tab_scan" onclick="switchTab('scan')">📷 Olvasó & Könyvelés</button>
        <button class="tab" id="tab_browse" onclick="switchTab('browse')">🔍 Böngésző</button>
    </div>

    <div id="scan_view">
        <button class="btn-cam" onclick="startScanner('normal')" id="camBtn">📷 Vonalkód Olvasása</button>
        <button class="btn-search-mode" onclick="startScanner('search')" id="camSearchBtn">🎯 Keresés Kamerával</button>
        
        <div id="scanner_wrapper">
            <div id="scan_feedback"></div>
            <div id="reader"></div>
            <!-- ÚJ: LEÁLLÍTÓ GOMB (Csak kamerázás közben látszik) -->
            <button class="btn-remove" id="stopCamBtn" onclick="stopScanner()" style="display: none; width: 100%; margin-top: 10px;">🛑 Kamera Bezárása</button>
        </div>
        
        <div id="zoom_container">
            <label style="font-size: 14px; font-weight: bold; color: #0D6EFD;">🔍 Nagyítás (Zoom):</label>
            <input type="range" id="zoom_slider" min="1" max="3" step="0.1" value="1">
        </div>
        
        <input type="text" id="erp_id" placeholder="Cikkszám (Kézzel is beírható)" onchange="keresCikk()" style="font-weight: bold;">
        
        <div id="loader">⏳ Adatok feldolgozása...</div>
        <div id="item_info">Nincs kiválasztott tétel.</div>
        
        <input type="number" id="qty" placeholder="Mennyiség (db)" min="1" value="1">
        <input type="text" id="remark" placeholder="Megjegyzés (Kötelező)">
        
        <div class="image-box">
            <label>
                <input type="checkbox" id="use_image" onchange="toggleImageInput()" style="width: auto; transform: scale(1.3); margin-right: 10px;"> 
                Fénykép csatolása
            </label>
            <div id="image_container" style="display: none;">
                <input type="file" id="camera_input" accept="image/*" onchange="previewImage(event)">
                <img id="image_preview" style="max-width: 100%; max-height: 200px; margin-top: 10px; display: none; border-radius: 5px; border: 1px solid #ccc;">
            </div>
        </div>

        <button class="btn-remove" onclick="konyvel('remove')">➖ KIVÉT (Kiadás)</button>
        <button class="btn-add" onclick="konyvel('return_item')">➕ VISSZAVÉTELEZÉS</button>
    </div>

    <div id="browse_view" style="display: none;">
        <input type="text" id="local_search" placeholder="Gyorskeresés a cikkek között..." oninput="filterList()" autocomplete="off">
        <div id="browse_loader" style="display: none; color: #198754; font-weight: bold; margin: 10px;">Adatok letöltése...</div>
        <div id="item_list" class="list-container"></div>
    </div>
</div>

<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz31ckHWQXgMuapMDOD7xyKxRIAJoCjbwvYLWoL7b6UqPz5-WZXbzpGH5i_y9yXpPo/exec"; 
    const html5QrCode = new Html5Qrcode("reader");
    let currentUser = "";
    let allItems = []; 
    let currentStreamTrack = null; 
    
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx;
    
    function initAudio() {
        if (!audioCtx) audioCtx = new AudioContext();
        if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playBeep(type) {
        try {
            if (!audioCtx) return;
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            if (type === 'success') {
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(800, audioCtx.currentTime);
                oscillator.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
                gainNode.gain.setValueAtTime(1, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.3);
            } else {
                oscillator.type = 'square';
                oscillator.frequency.setValueAtTime(300, audioCtx.currentTime);
                gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.1);
            }
        } catch(e) { console.log("Audio nem támogatott"); }
    }

    function toggleImageInput() {
        const isChecked = document.getElementById('use_image').checked;
        document.getElementById('image_container').style.display = isChecked ? 'block' : 'none';
        if (!isChecked) {
            document.getElementById('camera_input').value = "";
            document.getElementById('image_preview').style.display = "none";
        }
    }

    function previewImage(event) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = document.getElementById('image_preview');
                img.src = e.target.result;
                img.style.display = 'block';
            }
            reader.readAsDataURL(file);
        }
    }

    function compressImage(file, maxSize) {
        return new Promise((resolve, reject) => {
            const img = new Image();
            img.onload = () => {
                URL.revokeObjectURL(img.src); 
                const canvas = document.createElement('canvas');
                let width = img.width, height = img.height;
                if (width > height && width > maxSize) { height *= maxSize / width; width = maxSize; } 
                else if (height > maxSize) { width *= maxSize / height; height = maxSize; }
                canvas.width = width; canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);
                resolve(canvas.toDataURL('image/jpeg', 1.0).split(',')[1]); 
            };
            img.onerror = () => reject(new Error("Hiba a kép beolvasásakor"));
            img.src = URL.createObjectURL(file); 
        });
    }

    async function doFetch(payload) {
        const res = await fetch(SCRIPT_URL, {
            method: 'POST',
            body: JSON.stringify(payload)
        });
        const text = await res.text();
        try { return JSON.parse(text); } 
        catch(e) { throw new Error("Szerver hiba:\n" + text); }
    }

    async function doLogin() {
        const u = document.getElementById("login_user").value.trim();
        const p = document.getElementById("login_pin").value.trim();
        if(!u || !p) return alert("Add meg a nevet és a PIN kódot!");
        
        document.getElementById("login_loader").style.display = "block";
        try {
            const data = await doFetch({ action: 'login', user: u, pin: p });
            document.getElementById("login_loader").style.display = "none";
            if (data.status === 'ok') {
                currentUser = data.name;
                document.getElementById("login_screen").style.display = "none";
                document.getElementById("app_screen").style.display = "block";
            } else { alert(data.message); }
        } catch(e) {
            document.getElementById("login_loader").style.display = "none";
            alert("Hálózati hiba:\n" + e.message);
        }
    }

    function switchTab(tab) {
        if (tab === 'scan') {
            document.getElementById('scan_view').style.display = 'block';
            document.getElementById('browse_view').style.display = 'none';
            document.getElementById('tab_scan').classList.add('active');
            document.getElementById('tab_browse').classList.remove('active');
        } else {
            document.getElementById('scan_view').style.display = 'none';
            document.getElementById('browse_view').style.display = 'block';
            document.getElementById('tab_scan').classList.remove('active');
            document.getElementById('tab_browse').classList.add('active');
            if (allItems.length === 0) loadAllItems();
        }
    }

    async function loadAllItems() {
        document.getElementById('browse_loader').style.display = "block";
        try {
            const data = await doFetch({ action: 'get_all' });
            if (data.status === 'ok') {
                allItems = data.results;
                renderList(allItems);
            } else { alert(data.message); }
        } catch(e) { alert("Hiba a cikkek letöltésekor: " + e.message); }
        document.getElementById('browse_loader').style.display = "none";
    }

    function renderList(items) {
        const div = document.getElementById('item_list');
        div.innerHTML = "";
        items.forEach(r => {
            const el = document.createElement('div');
            el.className = 'search-item';
            el.innerHTML = `<span class="tag">${r.erpid}</span><br>${r.name} <br><small>Hely: ${r.location} | Készlet: <b style="color:#198754">${r.qty} db</b></small>`;
            el.onclick = () => {
                document.getElementById("erp_id").value = r.erpid;
                switchTab('scan');
                keresCikk();
            };
            div.appendChild(el);
        });
    }

    function filterList() {
        const q = document.getElementById("local_search").value.toLowerCase();
        const filtered = allItems.filter(r => r.erpid.toLowerCase().includes(q) || r.name.toLowerCase().includes(q));
        renderList(filtered);
    }

    let scanMode = 'normal';
    let targetErpId = "";
    let lastScanTime = 0;
    let lastScannedCode = "";

    function startScanner(mode = 'normal') {
        initAudio(); 
        scanMode = mode;
        const erpInput = document.getElementById("erp_id");
        targetErpId = erpInput.value.trim().toLowerCase();
        
        if (scanMode === 'search' && !targetErpId) {
            alert("🎯 Kereső módhoz előbb írd be (vagy másold be) a keresett cikkszámot a szövegdobozba!");
            erpInput.focus();
            return;
        }

        document.getElementById("scanner_wrapper").style.display = "block";
        document.getElementById("stopCamBtn").style.display = "block"; // Leállító gomb megjelenítése
        document.getElementById("camBtn").style.display = "none";
        document.getElementById("camSearchBtn").style.display = "none";
        document.getElementById("scan_feedback").style.display = "none";
        
        const config = { 
            fps: 15, 
            qrbox: function(viewfinderWidth, viewfinderHeight) {
                let size = Math.min(viewfinderWidth, viewfinderHeight) * 0.75;
                return { width: size, height: size };
            }
        };
        
        html5QrCode.start(
            { facingMode: "environment" }, 
            config, 
            (decodedText) => {
                const now = Date.now();
                
                // --- KERESŐ MÓD LOGIKÁJA ---
                if (scanMode === 'search') {
                    const fb = document.getElementById("scan_feedback");
                    
                    if (decodedText.toLowerCase() === targetErpId) {
                        fb.style.backgroundColor = "rgba(25, 135, 84, 0.95)"; 
                        fb.innerText = "✅ MEGVAN: " + decodedText;
                        fb.style.display = "block";
                        
                        // Csak akkor csipog újra, ha eltelt 2 mp, vagy egy másik vonalkódról tértünk vissza rá
                        if (now - lastScanTime > 2000 || lastScannedCode !== decodedText) {
                            playBeep('success');
                            if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
                            
                            // Háttérben letöltjük az adatait, de a kamera nyitva marad!
                            document.getElementById("erp_id").value = decodedText;
                            keresCikk(); 
                            
                            lastScanTime = now;
                            lastScannedCode = decodedText;
                        }
                    } else {
                        fb.style.backgroundColor = "rgba(220, 53, 69, 0.9)"; 
                        fb.innerText = "❌ Másik tétel: " + decodedText;
                        fb.style.display = "block";
                        
                        if (now - lastScanTime > 2000 || lastScannedCode !== decodedText) {
                            playBeep('error');
                            lastScanTime = now;
                            lastScannedCode = decodedText;
                        }
                    }
                    
                    // Ha 1.5 másodpercig nem lát vonalkódot, elrejti a feliratot
                    clearTimeout(window.hideFb);
                    window.hideFb = setTimeout(() => { 
                        fb.style.display = "none"; 
                        lastScannedCode = ""; 
                    }, 1500);

                } 
                // --- NORMÁL MÓD LOGIKÁJA (Azonnal leállít és bezár) ---
                else {
                    document.getElementById("erp_id").value = decodedText;
                    if (navigator.vibrate) navigator.vibrate(200);
                    stopScanner();
                    keresCikk(); 
                }
            }
        ).then(() => {
            setTimeout(() => {
                try {
                    const videoElement = document.querySelector("#reader video");
                    if (videoElement && videoElement.srcObject) {
                        const track = videoElement.srcObject.getVideoTracks()[0];
                        currentStreamTrack = track;
                        const capabilities = track.getCapabilities();
                        
                        if (capabilities.zoom) {
                            const slider = document.getElementById("zoom_slider");
                            slider.min = capabilities.zoom.min;
                            slider.max = capabilities.zoom.max;
                            slider.step = capabilities.zoom.step || 0.1;
                            slider.value = track.getSettings().zoom || capabilities.zoom.min;
                            document.getElementById("zoom_container").style.display = "block";
                            
                            slider.oninput = function() {
                                track.applyConstraints({advanced: [ {zoom: parseFloat(slider.value)} ]});
                            };
                        }
                    }
                } catch(e) { console.log("Zoom not supported", e); }
            }, 500);
        }).catch(err => {
            alert("Nem sikerült elindítani a kamerát!\nOka: " + err);
            stopScanner();
        });
    }

    function stopScanner() {
        try { html5QrCode.stop(); } catch(e) {}
        document.getElementById("scanner_wrapper").style.display = "none";
        document.getElementById("stopCamBtn").style.display = "none"; // Leállító gomb elrejtése
        document.getElementById("camBtn").style.display = "inline-block";
        document.getElementById("camSearchBtn").style.display = "inline-block";
        document.getElementById("zoom_container").style.display = "none";
        document.getElementById("scan_feedback").style.display = "none";
        currentStreamTrack = null;
    }

    async function uploadItemImage(event) {
        const file = event.target.files[0];
        const erpid = document.getElementById("erp_id").value.trim();
        if (!file || !erpid) return;
        
        document.getElementById("loader").innerText = "⏳ Fénykép tömörítése és feltöltése...";
        document.getElementById("loader").style.display = "block";
        try {
            const base64Image = await compressImage(file, 1024);
            const data = await doFetch({ action: 'upload_item_image', erp_id: erpid, image_data: base64Image });
            document.getElementById("loader").style.display = "none";
            if (data.status === 'ok') {
                alert("Fénykép sikeresen feltöltve!");
                keresCikk(); 
            } else { alert("Hiba: " + data.message); }
        } catch(e) {
            document.getElementById("loader").style.display = "none";
            alert("Hiba a feltöltéskor!");
        }
    }

    async function keresCikk() {
        const erpid = document.getElementById("erp_id").value.trim();
        if (!erpid) return;
        
        document.getElementById("item_info").innerHTML = "";
        document.getElementById("loader").innerText = "⏳ Adatok lekérése...";
        document.getElementById("loader").style.display = "block";
        
        try {
            const data = await doFetch({ action: 'get', erp_id: erpid });
            document.getElementById("loader").style.display = "none";
            
            if (data.status === 'ok') {
                let imgHtml = "";
                if (data.image_url) {
                    let thumbUrl = data.image_url;
                    if(thumbUrl.includes("export=view")) {
                        thumbUrl = thumbUrl.replace("uc?export=view&id=", "thumbnail?id=") + "&sz=w800";
                    }
                    imgHtml = `<img src="${thumbUrl}" style="width:100%; max-height:200px; object-fit:contain; margin-top:10px; border-radius:8px; border:1px solid #ccc;">`;
                }
                
                document.getElementById("item_info").innerHTML = `
                    <span class="tag">${data.name}</span><br>
                    <span style="color: gray;">Raktárhely:</span> <b>${data.location}</b><br>
                    <span style="color: gray;">Készlet:</span> <b style="color: #198754; font-size: 18px;">${data.qty} db</b>
                    ${imgHtml}
                    <div style="margin-top:15px; text-align:center;">
                        <label class="btn-cam" style="display:inline-block; width:90%; padding:10px; cursor:pointer; font-size:14px; border-radius:8px; color:white; font-weight:bold;">
                            📷 Új fotó a cikkhez (Kamera)
                            <input type="file" accept="image/*" capture="environment" style="display:none;" onchange="uploadItemImage(event)">
                        </label>
                    </div>
                `;
            } else {
                document.getElementById("item_info").innerHTML = `<span style="color: red;">${data.message}</span>`;
            }
        } catch(e) {
            document.getElementById("loader").style.display = "none";
            document.getElementById("item_info").innerHTML = `<span style="color: red;">Hiba: ${e.message}</span>`;
        }
    }

    async function konyvel(action) {
        const erpid = document.getElementById("erp_id").value.trim();
        const qty = parseInt(document.getElementById("qty").value);
        const remark = document.getElementById("remark").value.trim();
        
        const useImage = document.getElementById("use_image").checked;
        const fileInput = document.getElementById("camera_input");
        
        if (!erpid || !qty || qty <= 0) return alert("Hibás vagy hiányzó adatok (Cikkszám, Mennyiség)!");
        if (!remark) return alert("Könyveléshez a megjegyzés mező kitöltése kötelező!");
        
        if (useImage && (!fileInput.files || fileInput.files.length === 0)) {
            return alert("Kiválasztottad a kép csatolását, de nem csatoltál fotót!");
        }

        document.getElementById("loader").style.display = "block";
        if(useImage) document.getElementById("loader").innerText = "⏳ Kép tömörítése és feltöltése...";
        else document.getElementById("loader").innerText = "⏳ Könyvelés folyamatban...";
        
        try {
            let base64Image = "";
            if (useImage && fileInput.files[0]) {
                base64Image = await compressImage(fileInput.files[0], 1024); 
            }

            const payload = { 
                action: action, 
                erp_id: erpid, 
                qty: qty, 
                remark: remark, 
                user: currentUser,
                image_data: base64Image
            };

            const data = await doFetch(payload);
            document.getElementById("loader").style.display = "none";
            
            if (data.status === 'ok') {
                alert(`Sikeres könyvelés!\nÚj készlet: ${data.new_qty} db`);
                
                document.getElementById("erp_id").value = "";
                document.getElementById("qty").value = "1";
                document.getElementById("remark").value = "";
                document.getElementById("item_info").innerText = "Nincs kiválasztott tétel.";
                document.getElementById("use_image").checked = false;
                toggleImageInput();
                
                if (allItems.length > 0) loadAllItems(); 
            } else {
                alert("Hiba történt: " + data.message);
            }
        } catch(e) {
            document.getElementById("loader").style.display = "none";
            alert("Könyvelési hiba:\n" + e.message);
        }
    }
</script>
</body>
</html>
